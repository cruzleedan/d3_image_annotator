name: d3_image_annotator
description: >-
  Annotate images with shapes, arrows, and freehand marks. Geometry is
  stored in normalized image space, so a mark lands in the same place at
  any zoom, screen size, or export resolution.
version: 0.1.0
homepage: https://github.com/cruzleedan/d3_image_annotator
repository: https://github.com/cruzleedan/d3_image_annotator
issue_tracker: https://github.com/cruzleedan/d3_image_annotator/issues

topics:
  - annotation
  - image
  - drawing
  - markup

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

  # This package's first third-party dependency (WORK-0030). Used only
  # to PNG-encode a rendered image off the root isolate for large
  # outputs -- ui.Image.toByteData has no way to do that itself, and
  # engine PNG encoding blocks the UI for ~540ms at 12MP
  # (flutter/flutter#164434, closed with no fix). Below the size where
  # that fixed isolate cost pays for itself, the engine path is used
  # instead; see render_annotated_image.dart.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
